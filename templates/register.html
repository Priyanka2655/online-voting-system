
{% extends "base.html" %}

{% block content %}

<section class="panel narrow register-panel">

    <div class="eyebrow">VOTER REGISTRATION</div>

    <h2>Create Your Account</h2>

    <p class="muted">
        Register yourself to participate in the online voting system.
    </p>

    <form method="post">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            maxlength="100"
            required
        >

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username"
            maxlength="50"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
        >

        <button type="submit" class="btn full">
            Create Account
        </button>

    </form>

    <p class="muted center">
        Already have an account?
        <a href="{{ url_for('login') }}">Login Here</a>
    </p>

</section>

{% endblock %}
