
{% extends "base.html" %}

{% block content %}

<section class="panel narrow login-panel">

    <div class="eyebrow">USER LOGIN</div>

    <h2>Welcome Back!</h2>

    <p class="muted">
        Sign in to continue to your voting dashboard.
    </p>

    <form method="post">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" class="btn full">
            Login to Account
        </button>

    </form>

    <p class="muted center">
        New voter?
        <a href="{{ url_for('register') }}">Create an account</a>
    </p>

</section>

{% endblock %}
